# Second barrier, on the remote: catches what slipped past the local hook (e.g. with --no-verify).
name: scan

on:
  push:
  pull_request:

# gitleaks-action lists the PR's commits through the API; the default token cannot read pull requests.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test-sanitize.py
      - run: python3 tools/sanitize.py --all
      - run: tools/check-size.sh
