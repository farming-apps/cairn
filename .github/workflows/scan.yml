# Second barrier, on the remote: catches what slipped past the local hook (e.g. with --no-verify).
name: scan

on:
  push:
  pull_request:

# The gitleaks CLI is used directly: gitleaks-action requires a paid license for organization repos.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        # --redact keeps any finding out of the public log.
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts are executable in git
        # install.sh never chmods the installed copy, so a 100644 script would simply not run there.
        run: |
          bad="$(git ls-files -s -- '.githooks/*' 'tools/*.sh' 'tools/*.py' tools/ai tools/cairn | awk '$1 != "100755"')"
          [ -z "$bad" ] || { echo "not executable in git (git update-index --chmod=+x <file>):"; echo "$bad"; exit 1; }
      - run: python3 tools/test-sanitize.py
      - run: python3 tools/sanitize.py --all
      - run: tools/check-size.sh
