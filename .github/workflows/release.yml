# Opens/updates a release PR from Conventional Commits on main; merging it bumps VERSION,
# updates CHANGELOG.md and creates the vX.Y.Z tag that tools/update.sh installs.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
